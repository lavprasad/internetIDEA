<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Until</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Until</h1>
    <p class="lede">Countdowns to moments you care about. Stored only in this browser.</p>
    <form id="add-form" novalidate>
      <label for="title">Title</label>
      <input id="title" name="title" type="text" maxlength="60" autocomplete="off">
      <label for="when">When</label>
      <input id="when" name="when" type="datetime-local">
      <button type="submit">Add</button>
      <p id="error" role="alert" hidden></p>
    </form>
    <h2>Moments</h2>
    <p id="empty">No countdowns yet.</p>
    <ul id="list"></ul>
  </main>
  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
