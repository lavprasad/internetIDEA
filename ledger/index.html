<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ledger</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Ledger</h1>
    <p class="lede">Spending stays on this device.</p>

    <form id="entry-form" novalidate>
      <label for="amount">Amount</label>
      <input id="amount" name="amount" type="text" inputmode="decimal" autocomplete="off">

      <label for="category">Category</label>
      <select id="category" name="category">
        <option value="food">Food</option>
        <option value="transport">Transport</option>
        <option value="home">Home</option>
        <option value="health">Health</option>
        <option value="other">Other</option>
      </select>

      <label for="date">Date</label>
      <input id="date" name="date" type="date">

      <label for="note">Note</label>
      <input id="note" name="note" type="text" maxlength="80" autocomplete="off">

      <button type="submit">Add</button>
      <p id="form-error" class="error" role="alert"></p>
    </form>

    <section>
      <label for="month">Month</label>
      <input id="month" name="month" type="month">
      <p id="total" class="total"></p>
      <ul id="breakdown"></ul>
      <div id="list"></div>
      <button id="export" type="button">Export CSV</button>
    </section>
  </main>
  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
